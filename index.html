<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Research Papers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 45px;
            border-radius: 16px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 35px;
        }

        .paper {
            display: block;
            text-decoration: none;
            color: white;
            background: #24292f;
            padding: 18px;
            margin: 18px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .paper:hover {
            background: #444c56;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Research Papers</h1>

        <a
            class="paper"
            href="https://github.com/lakshminarayanan-afk/Fetal-CARE"
            target="_blank">
            Fetal-CARE
        </a>

        <a
            class="paper"
            href="https://github.com/lakshminarayanan-afk/FetalEDL"
            target="_blank">

        </a>

    </div>

</body>
</html>
